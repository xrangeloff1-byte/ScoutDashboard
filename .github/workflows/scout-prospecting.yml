name: Scout Prospect Research
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1-5'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research public business leads
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python operations/scout_prospect.py
      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-prospect-review
          path: |
            operations/prospects.csv
            operations/prospect_report.md
          retention-days: 30
