name: Scout Automatic Draft Preparation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,13 * * *'
permissions:
  contents: read
concurrency:
  group: scout-autodrafts
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previously discovered businesses
        uses: actions/cache/restore@v4
        with:
          path: operations/prospects.csv
          key: scout-prospects-${{ github.run_id }}
          restore-keys: |
            scout-prospects-
      - name: Discover businesses from free public data
        run: python operations/scout_prospect.py
      - name: Save discovered businesses for future runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: operations/prospects.csv
          key: scout-prospects-${{ github.run_id }}
      - name: Qualify websites
        run: python operations/scout_qualify.py
      - name: Prepare Gmail drafts only if OAuth is configured (never send)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SCOUT_SENDER_NAME: ${{ vars.SCOUT_SENDER_NAME }}
          SCOUT_BUSINESS_CONTACT: ${{ vars.SCOUT_BUSINESS_CONTACT }}
          SCOUT_MAX_DRAFTS: '5'
        run: python operations/scout_autodrafts.py
      - name: Build offline Scout command center
        run: python operations/scout_dashboard.py
      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-autodrafts-review
          path: |
            operations/prospects.csv
            operations/prospect_report.md
            operations/draft_review.csv
            operations/draft_review.md
            operations/draft_inbox.html
            operations/scout_command_center.html
            operations/qualified_leads.csv
            operations/outreach_drafts.md
            operations/qualification_report.md
          retention-days: 7
