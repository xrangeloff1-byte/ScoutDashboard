name: Scout Outreach Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover businesses from free public data
        run: python operations/scout_prospect.py
      - name: Prepare five offline drafts for review
        run: python operations/scout_outreach_review.py
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: scout-outreach-review
          path: |
            operations/prospects.csv
            operations/prospect_report.md
            operations/outreach_review.csv
            operations/outreach_report.md
          retention-days: 7
          if-no-files-found: error
